<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Panel de Administración - Sol Argentino TV Noticias</title>
    <link rel="stylesheet" href="assets/css/admin.css" />

    <style>
        /* ===== Overlay Login ===== */
        #overlay-login {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: #fff;
            border: 1px solid #ddd;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
            font-family: sans-serif;
        }

        .login-box h2 {
            margin-bottom: 1rem;
            color: #111827;
        }

        .login-box input {
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .login-box button {
            width: 100%;
            padding: 0.6rem;
            background: #111827;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #374151;
        }

        .login-box p {
            color: red;
            display: none;
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>

    <!-- Overlay de login -->
    <div id="overlay-login">
        <div class="login-box">
            <h2>Iniciar sesión</h2>
            <input type="text" id="usuario" placeholder="Nombre de usuario" required>
            <input type="password" id="clave" placeholder="Contraseña" required>
            <button id="btn-login">Entrar</button>
            <p id="msg-error">Usuario o contraseña incorrectos</p>
        </div>
    </div>

    <!-- Header -->
    <header class="site-header container">
        <div class="header-inner">
            <div class="brand">
                <img src="assets/media/images/placeholder.png" alt="Logo" class="logo">
                <span class="site-title">Panel Admin</span>
            </div>
            <div class="actions">
                <button id="btn-logout" class="btn-outline">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Formulario para crear artículo -->
        <section class="articulo">
            <h2 class="titulo">Crear nuevo artículo</h2>

            <!-- status -->
            <div id="status" aria-live="polite" style="margin-bottom:0.75rem;color:#1f2937;"></div>

            <form id="form-articulo">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" required>

                <label for="contenido">Contenido (HTML permitido):</label>
                <textarea id="contenido" name="contenido" rows="6" required></textarea>

                <label for="categoria">Categoría:</label>
                <input type="text" id="categoria" name="categoria" placeholder="General" required>

                <label for="imageUrl">Imagen - URL (opcional, preferida):</label>
                <input type="url" id="imageUrl" name="imageUrl" placeholder="https://ejemplo.com/imagen.jpg">

                <label for="imagen">O subir imagen (opcional):</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">

                <button type="submit" class="btn-outline" style="margin-top:1rem;">Crear artículo</button>
            </form>
        </section>

        <!-- Lista de artículos -->
        <section class="articulo" style="margin-top:2rem;">
            <h2 class="titulo">Lista de artículos</h2>
            <div id="lista-articulos" class="article-layout">
                <!-- Aquí se generarán dinámicamente los artículos -->
            </div>
        </section>
    </main>

    <script type="module" src="assets/js/admin.js"></script>

    <script>
        const overlayID = "overlay-login";

        // Función para crear el overlay si no existe
        function createOverlay() {
            if (document.getElementById(overlayID)) return;

            const overlay = document.createElement("div");
            overlay.id = overlayID;
            overlay.innerHTML = `
                <div class="login-box">
                    <h2>Iniciar sesión</h2>
                    <input type="text" id="usuario" placeholder="Nombre de usuario" required>
                    <input type="password" id="clave" placeholder="Contraseña" required>
                    <button id="btn-login">Entrar</button>
                    <p id="msg-error">Usuario o contraseña incorrectos</p>
                </div>
            `;
            document.body.appendChild(overlay);
            attachLoginEvents();
        }

        // Asignar eventos al botón de login
        function attachLoginEvents() {
            const btn = document.getElementById("btn-login");
            if (!btn) return;
            btn.addEventListener("click", () => {
                const user = document.getElementById("usuario").value.trim();
                const pass = document.getElementById("clave").value.trim();
                const msg = document.getElementById("msg-error");

                if (user === "admin19012021" && pass === "19012021") {
                    document.getElementById(overlayID)?.remove();
                    sessionStorage.setItem("adminLogged", "true");
                } else {
                    msg.style.display = "block";
                }
            });
        }

        // Mostrar overlay si no está logueado
        if (!sessionStorage.getItem("adminLogged")) {
            createOverlay();
        }

        // Evita que se elimine el overlay manualmente
        const observer = new MutationObserver(() => {
            if (!document.getElementById(overlayID) && !sessionStorage.getItem("adminLogged")) {
                createOverlay();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // Botón de cerrar sesión
        document.getElementById("btn-logout").addEventListener("click", () => {
            sessionStorage.removeItem("adminLogged");
            createOverlay();
        });
    </script>
</body>

</html>
