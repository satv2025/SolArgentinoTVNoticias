<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Sol Argentino TV Noticias</title>
    <link rel="stylesheet" href="assets/css/homeandgeneral.css">
    <link rel="stylesheet" href="assets/css/individualhtmls.css">
</head>

<body>
    <!-- Header -->
    <header class="site-header container">
        <div class="header-inner">
            <div class="brand">
                <img src="assets/img/logo.png" alt="Logo" class="logo">
                <span class="site-title">Panel Admin</span>
            </div>
            <div class="actions">
                <button id="btn-logout" class="btn-outline">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Crear artículo -->
        <section class="articulo">
            <h2 class="titulo">Crear nuevo artículo</h2>
            <form id="form-articulo">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" required>

                <label for="contenido">Contenido (HTML permitido):</label>
                <textarea id="contenido" name="contenido" rows="5" required></textarea>

                <label for="categoria">Categoría:</label>
                <input type="text" id="categoria" name="categoria" placeholder="General" required>

                <label for="imagen">Imagen (opcional):</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">

                <button type="submit" class="btn-outline">Crear artículo</button>
            </form>
        </section>

        <!-- Lista de artículos -->
        <section class="articulo" style="margin-top:2rem;">
            <h2 class="titulo">Lista de artículos</h2>
            <div id="lista-articulos" class="article-layout">
                <!-- Los artículos se listarán aquí dinámicamente -->
            </div>
        </section>
    </main>

    <script type="module">
        import { crearArticulo, logout, initList } from './assets/js/admin.js';

        // Enviar formulario
        const form = document.getElementById("form-articulo");
        form.addEventListener("submit", e => {
            e.preventDefault();
            const titulo = form.titulo.value;
            const contenido = form.contenido.value;
            const categoria = form.categoria.value;
            const file = form.imagen.files[0];
            crearArticulo(titulo, contenido, categoria, file);
            form.reset();
        });

        // Logout
        document.getElementById("btn-logout").addEventListener("click", logout);

        // Inicializar lista al cargar
        document.addEventListener("DOMContentLoaded", () => {
            initList();
        });
    </script>
</body>

</html>
