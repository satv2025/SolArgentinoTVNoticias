<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin - Sol Argentino TV Noticias</title>
    <link rel="stylesheet" href="assets/css/homeandgeneral.css" />
    <style>
        /* Pequeños estilos específicos del panel */
        .admin-wrap {
            max-width: 1100px;
            margin: 2rem auto;
            display: grid;
            gap: 1.25rem;
            padding: 0 1rem;
        }

        .panel {
            background: #fff;
            padding: 1rem;
            border-radius: 10px;
            box-shadow: 0 8px 28px rgba(15, 15, 15, 0.04);
        }

        .form-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }

        .form-row>* {
            flex: 1 1 220px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
            font-size: 0.95rem;
            color: #222;
        }

        input[type="text"],
        select,
        input[type="file"] {
            width: 100%;
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid #eaeaea;
        }

        .editor {
            min-height: 220px;
            border: 1px solid #e9e9e9;
            padding: 0.85rem;
            border-radius: 8px;
            overflow: auto;
            background: #fff;
        }

        .btn-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.4rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: #0366d6;
            color: #fff;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid #ddd;
        }

        .articles-list {
            display: grid;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }

        .article-item {
            display: flex;
            justify-content: space-between;
            gap: 0.8rem;
            align-items: center;
            padding: 0.6rem;
            border-radius: 8px;
            background: #fafafa;
        }

        .article-item .meta {
            color: #666;
            font-size: 0.92rem;
        }

        .small {
            font-size: 0.9rem;
            color: #666;
        }

        .img-preview {
            max-width: 160px;
            max-height: 100px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            margin-top: 0.5rem;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <!-- Header (usa tu header existente o el que te pasé) -->
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <a href="index.html"><img src="assets/images/placeholder.jpg" alt="logo" class="logo"></a>
                <a href="index.html" class="site-title">Sol Argentino TV Noticias</a>
            </div>
            <nav class="main-nav" aria-label="Principal">
                <a href="index.html" class="nav-link">Inicio</a>
            </nav>
            <div class="actions">
                <button id="logoutBtn" class="btn btn-ghost" style="display:none">Salir</button>
            </div>
        </div>
    </header>

    <main class="admin-wrap">
        <div class="panel">
            <div class="topbar">
                <h2>Panel de administración</h2>
                <div class="small">Estado: <span id="authStatus">verificando...</span></div>
            </div>

            <hr style="margin:0.6rem 0 1rem 0" />

            <!-- FORM: Crear / Editar -->
            <form id="articleForm">
                <input type="hidden" id="docId" value="">
                <div class="form-row">
                    <div>
                        <label for="titulo">Título</label>
                        <input id="titulo" type="text" required placeholder="Título de la noticia">
                    </div>
                    <div>
                        <label for="categoria">Categoría</label>
                        <select id="categoria">
                            <option value="General">General</option>
                            <option value="Política">Política</option>
                            <option value="Deportes">Deportes</option>
                            <option value="Economía">Economía</option>
                            <option value="Cultura">Cultura</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div style="flex:1 1 300px;">
                        <label for="slug">Slug (opcional)</label>
                        <input id="slug" type="text" placeholder="por-ejemplo-noticia-importante">
                    </div>
                    <div>
                        <label for="estado">Estado</label>
                        <select id="estado">
                            <option value="publicado">Publicar</option>
                            <option value="borrador">Borrador</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="imagenFile">Imagen destacada (jpg/png)</label>
                    <input id="imagenFile" type="file" accept="image/*">
                    <img id="imgPreview" class="img-preview" src="" alt="Previsualización" style="display:none">
                </div>

                <div style="margin-top:0.8rem;">
                    <label>Contenido (HTML) <span style="font-weight:400;color:#777;font-size:0.9rem"> — puedes pegar
                            HTML o usar el editor</span></label>
                    <div id="editor" class="editor" contenteditable="true" aria-label="Editor de contenido">
                        <p>Empieza a escribir o pega HTML aquí...</p>
                    </div>
                    <textarea id="htmlContent" style="display:none" name="htmlContent"></textarea>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn btn-primary">Guardar noticia</button>
                    <button type="button" id="clearBtn" class="btn btn-ghost">Limpiar</button>
                </div>
            </form>
        </div>

        <div class="panel">
            <h3>Artículos existentes</h3>
            <div id="articles" class="articles-list">
                <!-- Lista generada por JS -->
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© <span id="year"></span> Sol Argentino TV Noticias</p>
        </div>
    </footer>

    <!-- SCRIPTS (module) -->
    <script type="module" src="assets/js/firebaseConfig.js"></script>
    <script type="module" src="assets/js/utils.js"></script>
    <script type="module" src="assets/js/admin.js"></script>

    <script>
        // year
        document.addEventListener('DOMContentLoaded', () => {
            const el = document.getElementById('year'); if (el) el.textContent = new Date().getFullYear();
        });
    </script>
</body>

</html>
