<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - Sol Argentino TV Noticias</title>
    <link rel="stylesheet" href="assets/css/homeandgeneral.css" />
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <a href="index.html"><img src="assets/images/placeholder.jpg" alt="logo" class="logo"></a>
                <a href="index.html" class="site-title">Sol Argentino TV Noticias</a>
            </div>
            <nav class="main-nav" aria-label="Principal">
                <a href="index.html" class="nav-link">Inicio</a>
            </nav>
        </div>
    </header>

    <main class="container" style="max-width:480px;margin-top:2rem;">
        <div style="background:#fff;padding:1rem;border-radius:10px;box-shadow:0 8px 20px rgba(15,15,15,0.04);">
            <h2>Acceso administrador</h2>
            <p>En el paso 3 conectaremos Firebase Auth. Por ahora este formulario es demo.</p>
            <form id="loginForm">
                <label>
                    Email
                    <input type="email" name="email" required
                        style="width:100%;padding:0.6rem;margin-top:0.4rem;border-radius:8px;border:1px solid #eaeaea;">
                </label>
                <label style="display:block;margin-top:0.75rem;">
                    Contraseña
                    <input type="password" name="password" required
                        style="width:100%;padding:0.6rem;margin-top:0.4rem;border-radius:8px;border:1px solid #eaeaea;">
                </label>
                <button type="submit"
                    style="margin-top:1rem;padding:0.6rem 1rem;border-radius:8px;background:#0366d6;color:#fff;border:none;font-weight:600;">Entrar</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© <span id="year"></span> Sol Argentino TV Noticias.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const el = document.getElementById('year');
            if (el) el.textContent = new Date().getFullYear();
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                alert('Demo login — conectaremos Firebase Auth en el paso 3.');
            });
        });
    </script>
</body>

</html>
