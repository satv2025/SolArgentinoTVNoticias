<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo - Sol Argentino TV Noticias</title>
    <link rel="stylesheet" href="../assets/css/individualhtmls.css">
</head>

<body>
    <header class="site-header container">
        <div class="header-inner">
            <div class="brand">
                <img src="../assets/img/logo.png" alt="Logo" class="logo">
                <span class="site-title">Sol Argentino TV Noticias</span>
            </div>
            <nav class="main-nav">
                <a href="../index.html" class="nav-link">Inicio</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="articulo-contenedor" class="article-layout">
            <!-- El artículo se renderiza aquí -->
        </div>
    </main>

    <script type="module">
        import { db } from '../assets/js/firebaseConfig.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

        const contenedor = document.getElementById('articulo-contenedor');

        // Obtener ID del query string
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (!id) {
            contenedor.innerHTML = "<p>Artículo no encontrado.</p>";
        } else {
            const articuloRef = doc(db, "articulos", id);

            getDoc(articuloRef).then(snapshot => {
                if (!snapshot.exists()) {
                    contenedor.innerHTML = "<p>Artículo no encontrado.</p>";
                    return;
                }

                const data = snapshot.data();
                contenedor.innerHTML = `
          <article class="articulo">
            ${data.imagenURL ? `<img src="${data.imagenURL}" alt="${data.titulo}" class="imagen">` : ""}
            <h1 class="titulo">${data.titulo}</h1>
            <p class="categoria">${data.categoria || ""}</p>
            <div class="contenido">${data.contenido}</div>
          </article>
        `;
            }).catch(err => {
                console.error(err);
                contenedor.innerHTML = "<p>Error cargando el artículo.</p>";
            });
        }
    </script>
</body>

</html>
