<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo - Sol Argentino TV Noticias</title>
    <link rel="stylesheet" href="../assets/css/individualhtmls.css">
</head>

<body>
    <!-- Header -->
    <header class="site-header container">
        <div class="header-inner">
            <div class="brand">
                <img src="../assets/img/logo.png" alt="Logo" class="logo">
                <span class="site-title">Sol Argentino TV Noticias</span>
            </div>
            <nav class="main-nav">
                <a href="../index.html" class="nav-link">Inicio</a>
            </nav>
        </div>
    </header>

    <!-- Main -->
    <main class="container">
        <div id="articulo-contenedor" class="article-layout">
            <!-- El artículo se renderiza aquí -->
        </div>
    </main>

    <script type="module">
        import { supabase } from '../assets/js/supabaseConfig.js';

        const contenedor = document.getElementById('articulo-contenedor');

        // Obtener ID del query string
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function cargarArticulo() {
            if (!id) {
                contenedor.innerHTML = "<p>Artículo no encontrado.</p>";
                return;
            }

            const { data, error } = await supabase
                .from('articulos')
                .select('*')
                .eq('id', id)
                .single();

            if (error || !data) {
                console.error(error);
                contenedor.innerHTML = "<p>Artículo no encontrado.</p>";
                return;
            }

            // Actualizar título del documento
            document.title = `${data.titulo} - Sol Argentino TV Noticias`;

            // Renderizar artículo
            contenedor.innerHTML = `
                <article class="articulo">
                    ${data.imagen_url ? `<img src="${data.imagen_url}" alt="${data.titulo}" class="imagen">` : ""}
                    <h1 class="titulo">${data.titulo}</h1>
                    <p class="categoria">${data.categoria || ""}</p>
                    <div class="contenido">${data.contenido}</div>
                </article>
            `;
        }

        document.addEventListener('DOMContentLoaded', cargarArticulo);
    </script>
</body>

</html>
